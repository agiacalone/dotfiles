# TokyoNight Night theme for tmux

set-option -g status "on"
set -g status-bg "#1a1b26"
set -g status-fg "#c0caf5"

set-window-option -g window-status-style bg="#1f2335",fg="#565f89"
set-window-option -g window-status-activity-style bg="#7aa2f7",fg="#1a1b26"
set-window-option -g window-status-current-style fg="#1a1b26",bg="#7aa2f7"

set-option -g pane-active-border-style fg="#7aa2f7"
set-option -g pane-border-style fg="#3b4261"

set-option -g message-style bg="#1a1b26",fg="#7aa2f7"
set-option -g message-command-style bg="#1a1b26",fg="#c0caf5"

set-option -g display-panes-active-colour "#7aa2f7"
set-option -g display-panes-colour "#3b4261"

set-window-option -g clock-mode-colour "#7aa2f7"

set-window-option -g window-status-bell-style fg="#1a1b26",bg="#f7768e"

set-option -g status-justify "left"
set-option -g status-left-length "80"
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

set-option -g status-left ""
set-option -g status-right "#[fg=#c0caf5,bg=#1a1b26] %d-%b %H:%M #[fg=#1a1b26,bg=#7aa2f7] #h "

set-window-option -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7] #I:#[fg=#1a1b26,bg=#7aa2f7,bold] #W "
set-window-option -g window-status-format "#[fg=#565f89,bg=#1f2335] #I: #W "
