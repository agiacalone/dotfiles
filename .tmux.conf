# .tmux.conf File
# By Anthony Giacalone
# anthonyg@sdf.org

#--General-Settings-------------------------------------------------------------
set -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -ga terminal-overrides ",screen-256color:Tc"
set -g status-interval 1
set -g mouse on
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

#--Key-Bindings-----------------------------------------------------------------
set -g prefix C-a
bind-key C-a last-window
bind-key C-h previous-window
bind-key C-n next-window
bind-key C-c new-window
bind-key C-d detach

bind | split-window -h
bind _ split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
# l is for last window by default; kept as-is to preserve that behavior
#bind l select-pane -R

#--Usability--------------------------------------------------------------------
set-option -g status-keys vi
set-window-option -g mode-keys vi
set -g display-time 3000
set -g set-titles on
setw -g automatic-rename on

# Set some status bar features
set -g @onedark_time_format "%R"
set -g @onedark_date_format "%d-%b"

#--Plugins----------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'odedlaz/tmux-status-variables'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'jsec/tmux-night-owl'

# Initialize the tmux plugin manager **MUST BE AT BOTTOM!**
run -b '~/.tmux/plugins/tpm/tpm'
