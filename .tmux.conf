# .tmux.conf File
# By Anthony Giacalone
# anthonyg@sdf.org

#--General-Settings-------------------------------------------------------------
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -s set-clipboard on
set -g status-interval 1
set -g history-limit 100000
set -g mouse on  # use shift-click to copy/paste
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# aggressive-resize misbehaves under iTerm2 on macOS (panes snap to the smallest
# attached client), so enable it only off-iTerm — same guard tmux-sensible uses.
# $TERM_PROGRAM is "tmux" inside if-shell, so read the real value from the global
# environment (iTerm also sets LC_TERMINAL).
if-shell 'case "$(tmux show-environment -g TERM_PROGRAM 2>/dev/null):$(tmux show-environment -g LC_TERMINAL 2>/dev/null)" in *iTerm*) exit 1;; esac' \
    'setw -g aggressive-resize on'
set -g escape-time 10
set -g allow-passthrough on
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

#--Key-Bindings-----------------------------------------------------------------
set -g prefix C-a
set -g prefix2 C-b  # ShadowTerm iOS app tmux keyboard assumes C-b
bind-key C-a last-window
bind-key C-h previous-window
bind-key C-n next-window
bind-key C-c new-window
bind-key C-d detach
bind-key r source-file ~/.tmux.conf \; display-message "tmux reloaded"

bind | split-window -h
bind _ split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U

# l is for last window by default; kept as-is to preserve that behavior
#bind l select-pane -R

#--Usability--------------------------------------------------------------------
set-option -g status-keys vi
set-window-option -g mode-keys vi
set -g display-time 3000
set -g set-titles on
setw -g automatic-rename on
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

#--Theme-----------------------------------------------------------------------
# Active theme — managed by `theme` (state in ~/.config/theme/current).
# Switch with: theme <name>   (also updates emulator/nvim/zsh live)
# tmux does NOT expand #(...) in a source-file path, so compute the theme name in
# a shell and source the matching conf (falling back to gruvbox-dark if missing).
run-shell 'n=$(cat ~/.config/theme/current 2>/dev/null || echo gruvbox-dark); f="$HOME/.tmux/themes/$n.conf"; [ -f "$f" ] || f="$HOME/.tmux/themes/gruvbox-dark.conf"; tmux source-file "$f"'

bind T run-shell "tmux-theme"

#--Plugins----------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize the tmux plugin manager **MUST BE AT BOTTOM!**
run '~/.tmux/plugins/tpm/tpm'
