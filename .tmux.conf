# .tmux.conf File
# By Anthony Giacalone
# anthonyg@sdf.org

#--General-Settings-------------------------------------------------------------
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -s set-clipboard on
set -g status-interval 1
set -g mouse on  # use shift-click to copy/paste
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'

#--Key-Bindings-----------------------------------------------------------------
set -g prefix C-a
set -g prefix2 C-b  # ShadowTerm iOS app tmux keyboard assumes C-b
bind-key C-a last-window
bind-key C-h previous-window
bind-key C-n next-window
bind-key C-c new-window
bind-key C-d detach

bind | split-window -h
bind _ split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U

# l is for last window by default; kept as-is to preserve that behavior
#bind l select-pane -R

#--Usability--------------------------------------------------------------------
set-option -g status-keys vi
set-window-option -g mode-keys vi
set -g display-time 3000
set -g set-titles on
setw -g automatic-rename on

#--Theme (gruvbox dark)---------------------------------------------------------
set-option -g status "on"
set -g status-bg "#3c3836"
set -g status-fg "#ebdbb2"

set-window-option -g window-status-style bg="#282828",fg="#a89984"
set-window-option -g window-status-activity-style bg="#fabd2f",fg="#282828"
set-window-option -g window-status-current-style fg="#282828",bg="#fabd2f"

set-option -g pane-active-border-style fg="#fabd2f"
set-option -g pane-border-style fg="#665c54"

set-option -g message-style bg="#282828",fg="#fabd2f"
set-option -g message-command-style bg="#282828",fg="#ebdbb2"

set-option -g display-panes-active-colour "#fabd2f"
set-option -g display-panes-colour "#665c54"

set-window-option -g clock-mode-colour "#83a598"

set-window-option -g window-status-bell-style fg="#282828",bg="#fb4934"

set-option -g status-justify "left"
set-option -g status-left-length "80"
set-option -g status-right-length "80"
set-window-option -g window-status-separator ""

set-option -g status-left ""
set-option -g status-right "#[fg=#ebdbb2,bg=#3c3836] %d-%b %H:%M #[fg=#282828,bg=#fabd2f] #h "

set-window-option -g window-status-current-format "#[fg=#282828,bg=#fabd2f] #I:#[fg=#282828,bg=#fabd2f,bold] #W "
set-window-option -g window-status-format "#[fg=#a89984,bg=#282828] #I: #W "

#--Plugins----------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Initialize the tmux plugin manager **MUST BE AT BOTTOM!**
run '~/.tmux/plugins/tpm/tpm'
